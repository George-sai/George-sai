name: Update contribution graph

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:           # lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/scripts/generate_graph.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate graph
        run: python .github/scripts/generate_graph.py
        env:
          # Uses the optional GH_PAT secret if you add one, otherwise the built-in token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          GRAPH_TITLE: "George's Contribution Graph"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ContributionGraph.svg
          git diff --cached --quiet || (git commit -m "Update contribution graph" && git push)
